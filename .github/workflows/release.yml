name: Release

# Push a tag like v0.1.0 to build every binary and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          go vet ./...
          go test ./...
          npm install
          npm test
      - name: Build binaries
        run: sh scripts/build-all.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
